<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>SIMON SAYS GAME</title>
    <link rel="stylesheet" href="simon.css" />
  </head>
  <body>
    <div class="highest-score"><h1>HIGH SCORE :</h1></div>

        <div class="line1">

          <div class="box b" type="button" id="b"></div>
        </div>
  
        <div class="line2">
          <div class="box c" type="button" id="c"></div>
          <div class="box d" type="button" id="d"></div>
        </div>
      </div></div>
    
    <script src="simons.js"></script>
